<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Weather Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <h1>☀️ Async Weather Tracker</h1>
        
        <div class="top-row">
            <div class="card search-card">
                <h3>Search City</h3>
                <div class="search-box">
                    <input type="text" id="cityInput" placeholder="Enter city name...">
                    <button id="searchBtn">Search</button>
                </div>
                <div class="history-section">
                    <h3>Search History</h3>
                    <div id="searchHistory" class="history-tags"></div>
                </div>
            </div>

            <div class="card info-card">
                <h3>Weather Info</h3>
                <div id="weatherResult" class="weather-table">
                    <div class="row"><span>City</span><span class="val">--</span></div>
                    <div class="row"><span>Temp</span><span class="val">--</span></div>
                    <div class="row"><span>Weather</span><span class="val">--</span></div>
                    <div class="row"><span>Humidity</span><span class="val">--</span></div>
                    <div class="row"><span>Wind</span><span class="val">--</span></div>
                </div>
            </div>
        </div>

        <div class="card console-card">
            <h3>Console – Event Loop</h3>
            <div id="eventLog" class="console-box">
                <div class="log-item">Ready to track...</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
